[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crewai-proofprice"
version = "0.1.0"
description = "CrewAI tools for ProofPrice: what did people actually pay for X, here, recently? Free, no API key."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["crewai>=0.100", "pydantic>=2"]

[tool.setuptools.packages.find]
where = ["src"]
