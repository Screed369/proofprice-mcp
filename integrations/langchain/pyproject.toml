[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-proofprice"
version = "0.1.0"
description = "LangChain tools for ProofPrice: what did people actually pay for X, here, recently? Free, no API key."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["langchain-core>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]
